<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Cyworld 2026</title>
        <link rel="stylesheet" href="loginStyle.css">
    </head>
    <body>
        <div class="login-container">
            <h2>Cyworld <span>2026</span></h2>
            <form id="loginForm">
                <label>Email</label>
                <input type="text" id="email" placeholder="input your email">

                <label>Password</label> 
                <input type="password" id="password" placeholder="input your password">
                
                <button type="submit">Login</button>
            </form>
            <div class="footer">
                Aren't you a member yet? <a href="signup.html">Sign Up</a>
            </div>
        </div>
        <script src="loginJS.js"></script>
    </body>
</html>
